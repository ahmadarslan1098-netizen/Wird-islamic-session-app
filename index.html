<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0D1B2A"/>
  <meta name="color-scheme" content="light"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>Wird — Daily Hifz & Dua Companion</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link rel="stylesheet" href="css/app.css"/>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header id="app-header" style="padding:1rem 1.25rem 0.5rem;display:flex;align-items:center;justify-content:space-between;">
      <div style="display:flex;align-items:center;gap:8px;">
        <div style="width:32px;height:32px;border-radius:8px;background:var(--primary);display:flex;align-items:center;justify-content:center;">
          <span class="material-symbols-outlined" style="font-size:18px;color:var(--secondary-container);">menu_book</span>
        </div>
        <div>
          <div style="font-size:16px;font-weight:700;color:var(--on-surface);">Wird</div>
          <div style="font-size:10px;color:var(--on-surface-variant);display:flex;align-items:center;gap:4px;">
            <span class="material-symbols-outlined" style="font-size:11px;color:var(--secondary);">wifi_off</span>
            Offline
          </div>
        </div>
      </div>
      <button onclick="app.showScreen('settings')" style="background:var(--surface-container-high);border:none;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;">
        <span class="material-symbols-outlined" style="font-size:20px;color:var(--on-surface-variant);">person</span>
      </button>
    </header>

    <!-- Home Screen -->
    <div id="screen-home" class="screen active"></div>

    <!-- Hifz Tracker Screen -->
    <div id="screen-hifz" class="screen"></div>

    <!-- Focus Session Screen -->
    <div id="screen-focus" class="screen"></div>

    <!-- Duas Screen -->
    <div id="screen-duas" class="screen"></div>

    <!-- Progress Screen -->
    <div id="screen-progress" class="screen"></div>

    <!-- Settings Screen -->
    <div id="screen-settings" class="screen"></div>

    <!-- Modal Container -->
    <div id="modal-container"></div>
    <!-- Hidden file input for import -->
    <input type="file" id="import-file" accept=".json" style="display:none;" onchange="app.handleImport(event)"/>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-screen="home" onclick="app.showScreen('home')">
        <span class="material-symbols-outlined">home</span>
        <span class="nav-label">Today</span>
      </button>
      <button class="nav-item" data-screen="hifz" onclick="app.showScreen('hifz')">
        <span class="material-symbols-outlined">menu_book</span>
        <span class="nav-label">Hifz</span>
      </button>
      <button class="nav-item" data-screen="focus" onclick="app.startSession()">
        <div class="nav-center-btn">
          <span class="material-symbols-outlined">play_arrow</span>
        </div>
        <span class="nav-label">Memorize</span>
      </button>
      <button class="nav-item" data-screen="duas" onclick="app.showScreen('duas')">
        <span class="material-symbols-outlined">mosque</span>
        <span class="nav-label">Duas</span>
      </button>
      <button class="nav-item" data-screen="progress" onclick="app.showScreen('progress')">
        <span class="material-symbols-outlined">insights</span>
        <span class="nav-label">Progress</span>
      </button>
    </nav>
  </div>

  <script src="data/surahs.js"></script>
  <script src="data/duas.js"></script>
  <script src="js/db.js"></script>
  <script src="js/srs.js"></script>
  <script src="js/app.js"></script>
  <script>
    // WirdApp is instantiated and initialized in js/app.js (redeclaring `app` here
    // would throw a SyntaxError and abort this script, killing SW registration).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
